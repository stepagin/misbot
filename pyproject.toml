[tool.ruff]
target-version = "py311"
line-length = 100
include = ["installer/**/*.py", "bots/**/*.py", "deployment/**/*.py", "ci/**/*.py"]
extend-exclude = ["dist", "node_modules"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Syntax, invalid comparisons/control flow and undefined names first.
select = ["E9", "F63", "F7", "F82"]
