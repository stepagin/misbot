[tool.ruff]
target-version = "py311"
line-length = 100
include = ["installer/**/*.py", "bots/**/*.py", "deployment/**/*.py", "ci/**/*.py"]
extend-exclude = ["dist", "node_modules"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Syntax, invalid comparisons/control flow and undefined names first.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
mypy_path = "installer"
files = ["installer/cli_commands.py", "installer/configuration_schema.py", "installer/s3_config.py", "installer/operation_models.py", "installer/backup_writers.py", "ci/check.py"]
strict = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["configuration", "state_store"]
follow_imports = "skip"
