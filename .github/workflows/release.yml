name: Misbot release
on:
  push:
    branches: ['**']
    tags: ['v[0-9]*', '[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'push' || github.ref_type == 'tag' || startsWith(github.ref_name, 'release/') || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.finalize.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.txt
          npm ci --ignore-scripts
      - name: Validate owner-selected release version
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/release.py prepare
      - name: Check sources, tests and reproducible archive
        run: python ci/check.py all --check-manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: misbot-installer
          overwrite: true
          path: |
            dist/matrix-installer.tar.gz
            dist/matrix-installer.tar.gz.sha256
            dist/misbot-setup-${{ steps.prepare.outputs.version }}.tar.gz
            dist/misbot-setup-${{ steps.prepare.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
      - name: Create release PR or tag validated merge
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/release.py finalize
  publish-release:
    if: needs.build.outputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.build.outputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.release_tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: misbot-installer
          path: dist
      - name: Publish release with verified installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Misbot $RELEASE_TAG" --notes-file installer/release-notes.md
          fi
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release upload "$RELEASE_TAG" dist/matrix-installer.tar.gz dist/matrix-installer.tar.gz.sha256 dist/misbot-setup-*.tar.gz dist/misbot-setup-*.tar.gz.sha256 --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release download "$RELEASE_TAG" --pattern 'matrix-installer.tar.gz*' --dir published
            cmp dist/matrix-installer.tar.gz published/matrix-installer.tar.gz
            cmp dist/matrix-installer.tar.gz.sha256 published/matrix-installer.tar.gz.sha256
            gh release download "$RELEASE_TAG" --pattern 'misbot-setup-*.tar.gz*' --dir published
            for asset in dist/misbot-setup-*.tar.gz*; do
              cmp "$asset" "published/${asset#dist/}"
            done
          fi
