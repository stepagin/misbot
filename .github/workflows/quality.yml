name: Source quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11.17', '3.12.15', '3.13.16', '3.14.8']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Install pinned development dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r ci/requirements.txt
          npm ci --ignore-scripts
      - name: Check source quality
        run: python ci/check.py
      - name: Run isolated tests
        run: |
          python -m unittest discover -s installer/tests -p 'test_*.py'
          python -m unittest discover -s bots/telegram/tests -p 'test_*.py'
          python -m unittest discover -s deployment/tests -p 'test_*.py'
          python -m unittest discover -s ci/tests -p 'test_*.py'
          npm test --prefix bots/matrix-referral
          node --test bots/matrix-federation/tests/*.test.js
          bash -n installer/install.sh
      - name: Verify release archive
        run: |
          python installer/build.py --check
          python installer/build.py
          cd dist
          sha256sum -c matrix-installer.tar.gz.sha256
          tar -xzf matrix-installer.tar.gz
          cd matrix-installer
          sha256sum -c SHA256SUMS
